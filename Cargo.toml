[workspace]
resolver = "2"
members = [
    "crates/borderless-core",
    "crates/borderless-protocol",
    "crates/borderless-server",
    "crates/borderless-signaling",
    "crates/borderless-relay",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
license      = "MIT"
authors      = ["Borderless Contributors"]
repository   = "https://github.com/rythmmcosta/Borderless"
homepage     = "https://github.com/rythmmcosta/Borderless"
description  = "Cross-platform KVM + sync — open-source Mouse Without Borders alternative"

[workspace.dependencies]
# Async runtime
tokio        = { version = "1.35",  features = ["full"] }

# Serialization
serde        = { version = "1.0",   features = ["derive"] }
serde_json   = { version = "1.0" }
prost        = { version = "0.12" }

# Utilities
uuid         = { version = "1.6",   features = ["v4", "v5", "serde"] }
chrono       = { version = "0.4",   features = ["serde"] }
bytes        = { version = "1.5" }
anyhow       = { version = "1.0" }
thiserror    = { version = "1.0" }
tracing      = { version = "0.1" }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
async-trait  = { version = "0.1" }

# Crypto
aes-gcm      = { version = "0.10" }
sha2         = { version = "0.10" }
hkdf         = { version = "0.12" }
rand         = { version = "0.8" }
rand_core    = { version = "0.6",   features = ["getrandom"] }
x25519-dalek = { version = "2.0",   features = ["static_secrets", "reusable_secrets"] }
ed25519-dalek = { version = "2.0",  features = ["rand_core"] }

# Networking
socket2      = { version = "0.5" }

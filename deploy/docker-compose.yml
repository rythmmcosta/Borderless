version: '3.9'

services:

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://borderless:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/borderless
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run: openssl rand -hex 32}
      JWT_EXPIRY_SECONDS: 900
      REFRESH_EXPIRY_SECONDS: 2592000
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:1420,https://borderless.myowncloud.tech}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@borderless.local}
      RUST_LOG: borderless_server=debug,tower_http=info
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  signaling:
    build:
      context: .
      dockerfile: deploy/Dockerfile.signaling
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env — run: openssl rand -hex 32}
      RUST_LOG: borderless_signaling=debug
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  coturn:
    image: coturn/coturn:latest
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-49200:49152-49200/udp"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: borderless
      POSTGRES_USER: borderless
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      --save 60 1
      --loglevel warning
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.web
    environment:
      NEXT_PUBLIC_SITE_URL: ${SITE_URL:-https://borderless.myowncloud.tech}
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: ${WS_URL:-wss://borderless.myowncloud.tech/ws}
      INTERNAL_API_URL: http://api:8080
      GITHUB_OWNER: ${GITHUB_OWNER:-rythmmcosta}
      GITHUB_REPO: ${GITHUB_REPO:-Borderless}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:

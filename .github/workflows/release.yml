name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0-dev'

permissions:
  contents: write
  packages: write

jobs:
  release-desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v3
        with: { version: 8 }
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libevdev-dev
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: pnpm install --no-frozen-lockfile
      - name: Generate Tauri icons
        working-directory: apps/desktop
        shell: bash
        run: |
          python3 -c "import struct,zlib;c=lambda n,d:(lambda b:struct.pack('>I',len(d))+b+struct.pack('>I',zlib.crc32(b)&0xffffffff))(n+d);rows=b''.join(b'\x00'+b'\x80\x80\x80'*1024 for _ in range(1024));open('app-icon-source.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',1024,1024,8,2,0,0,0))+c(b'IDAT',zlib.compress(rows))+c(b'IEND',b''))"
          pnpm tauri icon ./app-icon-source.png
      - name: Build desktop release
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }}
      - name: Upload desktop artifacts
        uses: softprops/action-gh-release@v1
        with:
          files: apps/desktop/src-tauri/target/release/bundle/**/*
          generate_release_notes: true

  release-mobile:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
      - name: Setup Android signing
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/borderless.jks
          cat > key.properties <<EOF
          storePassword=${KEY_STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=borderless.jks
          EOF
      - name: Build release APK
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build apk --release
      - name: Build release AAB
        working-directory: apps/mobile
        run: flutter build appbundle --release
      - name: Upload APK to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

  release-docker:
    name: Docker (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            dockerfile: deploy/Dockerfile.server
            image: borderless-server
          - name: signaling
            dockerfile: deploy/Dockerfile.signaling
            image: borderless-signaling
    steps:
      - uses: actions/checkout@v4
      - name: Compute safe Docker tag
        id: tag
        run: |
          safe=$(echo '${{ github.ref_name }}' | tr '/' '-' | tr ':' '-')
          echo "value=${safe}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ghcr.io/rythmmcosta/${{ matrix.image }}:${{ steps.tag.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

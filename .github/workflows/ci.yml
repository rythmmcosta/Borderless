name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build all crates
        run: cargo build --all
      - name: Run tests
        run: cargo test --all
      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v3
        with: { version: 8 }
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libevdev-dev libudev-dev
      - name: Install pnpm deps
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile
      - name: Generate Tauri icons
        working-directory: apps/desktop
        shell: bash
        run: |
          python3 -c "import struct,zlib;c=lambda n,d:(lambda b:struct.pack('>I',len(d))+b+struct.pack('>I',zlib.crc32(b)&0xffffffff))(n+d);rows=b''.join(b'\x00'+b'\x80\x80\x80'*1024 for _ in range(1024));open('app-icon-source.png','wb').write(b'\x89PNG\r\n\x1a\n'+c(b'IHDR',struct.pack('>IIBBBBB',1024,1024,8,2,0,0,0))+c(b'IDAT',zlib.compress(rows))+c(b'IEND',b''))"
          pnpm tauri icon ./app-icon-source.png
      - name: Build Tauri app
        working-directory: apps/desktop
        run: pnpm tauri build

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.22.0', channel: 'stable' }
      - working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

  web:
    name: Web Dashboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: pnpm/action-setup@v3
        with: { version: 8 }
      - working-directory: apps/web
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm type-check
          pnpm build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [rust]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: borderless_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/borderless_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test_secret_min_32_chars_for_tests
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --package borderless-server --features integration-tests
